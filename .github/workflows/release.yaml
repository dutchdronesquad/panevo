---
name: Release

# yamllint disable-line rule:truthy
on:
  release:
    types:
      - published

env:
  DEFAULT_NODE: 24

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v6.0.2
      - name: 🏗 Set up Node.js ${{ env.DEFAULT_NODE }}
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.DEFAULT_NODE }}
      - name: 🏗 Install dependencies
        run: npm ci
      - name: 🚀 Run TypeScript
        run: npm run type
      - name: 🚀 Run ESLint
        run: npm run lint
      - name: 🚀 Run Prettier
        run: npm run format:check

  make:
    name: Make ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            platform: macos
          - name: Windows x64
            os: windows-latest
            platform: windows
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v6.0.2
      - name: 🏗 Set up Node.js ${{ env.DEFAULT_NODE }}
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.DEFAULT_NODE }}
      - name: 🏗 Install dependencies
        run: npm ci
      - name: 🚀 Make distributables
        run: npm run make
      - name: ⬆️ Upload release asset
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            out/make/**/*.exe
            out/make/**/*.dmg
          fail_on_unmatched_files: true
          overwrite_files: true
